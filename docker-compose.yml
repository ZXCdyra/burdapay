x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgresql://payflow:payflow@postgres:5432/payflow?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: local-dev-jwt-secret-change-me-please
  APP_ENCRYPTION_KEY: local-dev-aes-key-change-me-please-32
  CARD_HASH_PEPPER: local-dev-pepper-change-me
  DEFAULT_ORDER_TTL_SECONDS: 900
  CORS_ORIGIN: '*'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: sh -c "npx prisma migrate deploy && npm run seed"
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    environment: *app-env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:

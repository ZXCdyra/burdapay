name: Deploy Prisma Migrations

on:
  workflow_dispatch:
  push:
    branches: [ production ]

jobs:
  migrate:
    name: Deploy migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Resolve failed migrations (if any)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          # If a previous run left a failed migration, mark it applied so deploy can continue.
          npx prisma migrate resolve --schema=prisma/schema.prisma --applied "2_add_deposit_requests" || true

      - name: Deploy Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

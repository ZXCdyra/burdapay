<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayFlow вЂ” РІС…РѕРґ</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css?v=6">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="logo">Pay<span>Flow</span></div>
    <div class="sub">РџР»Р°С‚С‘Р¶РЅС‹Р№ РїСЂРѕС†РµСЃСЃРёРЅРі В· CARD / SBP</div>
    <form id="loginForm">
      <label>Email<input type="email" id="email" required placeholder="you@corp.io" autocomplete="username"></label>
      <label>РџР°СЂРѕР»СЊ<input type="password" id="password" required placeholder="вЂўвЂўвЂўвЂўвЂўвЂўвЂўвЂў" autocomplete="current-password"></label>
      <button style="width:100%" type="submit">Р’РѕР№С‚Рё</button>
    </form>
    <div class="chips">
      <span class="chip">CARD</span><span class="chip">SBP</span>
      <span class="chip">REST API</span><span class="chip">Webhooks</span>
      <span class="chip">Socket.IO</span>
    </div>
    <p class="sub" style="margin:18px 0 0">Swagger API: <a href="/docs" target="_blank">/docs</a></p>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'РћС€РёР±РєР° РІС…РѕРґР°');
    localStorage.setItem('pf_token', data.accessToken);
    location.href = '/' + data.role.toLowerCase() + '.html';
  } catch (err) { alert(err.message); }
});
if (localStorage.getItem('pf_token')) {
  fetch('/auth/me', { headers: { Authorization: 'Bearer ' + localStorage.getItem('pf_token') } })
    .then((r) => (r.ok ? r.json() : null))
    .then((me) => { if (me) location.href = '/' + me.role.toLowerCase() + '.html'; });
}
</script>
</body>
</html>

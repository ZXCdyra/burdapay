<script src="/app.js?v=6"></script>
<script>
const TABS = ['dashboard', 'orders', 'merchants', 'traders', 'users', 'deposits', 'blacklist', 'webhooks', 'fraud'];
const LABELS = { dashboard:'РћР±Р·РѕСЂ', orders:'РћСЂРґРµСЂР°', merchants:'РњРµСЂС‡Р°РЅС‚С‹', traders:'РўСЂРµР№РґРµСЂС‹', users:'РџРѕР»СЊР·РѕРІР°С‚РµР»Рё',
  deposits:'РџРѕРїРѕР»РЅРµРЅРёСЏ', blacklist:'Р‘Р»СЌРєР»РёСЃС‚', webhooks:'Р’РµР±С…СѓРєРё', fraud:'РђРЅС‚РёС„СЂРѕРґ' };
let tab = 'dashboard';

(async () => {
  const me = await PF.requireRole('ADMIN');
  if (!me) return;
  document.getElementById('app').classList.remove('hidden');
  const nav = document.getElementById('nav');
  for (const t of TABS) {
    const b = document.createElement('button');
    b.textContent = LABELS[t];
    b.dataset.tab = t;
    b.onclick = () => { tab = t; render(); };
    nav.appendChild(b);
  }
  render();
  PF.connectWS({
    onOrderUpdated: (o) => { PF.toast(`РћСЂРґРµСЂ вЂ¦${o.id.slice(-8)} в†’ ${o.status}`); if (tab === 'orders' || tab === 'dashboard') render(); },
    onNewOrder: () => render(),
    onUserCreated: (u) => { if (tab === 'users') render(); else PF.toast(`РќРѕРІС‹Р№ РїРѕР»СЊР·РѕРІР°С‚РµР»СЊ: ${u.email || u.name}`); },
  });
})();

async function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  const v = document.getElementById('view');
  v.innerHTML = '<div class="empty">Р—Р°РіСЂСѓР·РєР°вЂ¦</div>';
  try {
    if (tab === 'dashboard') await viewDashboard(v);
    else if (tab === 'orders') await viewOrders(v);
    else if (tab === 'merchants') await viewMerchants(v);
    else if (tab === 'traders') await viewTraders(v);
    else if (tab === 'users') await viewUsers(v);
    else if (tab === 'deposits') await viewDeposits(v);
    else if (tab === 'blacklist') await viewBlacklist(v);
    else if (tab === 'webhooks') await viewWebhooks(v);
    else if (tab === 'fraud') await viewFraud(v);
  } catch (err) { v.innerHTML = `<div class="empty">${PF.esc(err.message)}</div>`; }
}

async function viewDeposits(v) {
  const list = await PF.api('/admin/deposits');
  v.innerHTML = `<div class="card"><div class="panel-t"><h2>Р—Р°СЏРІРєРё РЅР° РїРѕРїРѕР»РЅРµРЅРёРµ (${list.length})</h2>
    <button class="ghost" onclick="render()">вџі</button></div>${PF.table(['ID','Trader','Account','РЎСѓРјРјР°','РђРґСЂРµСЃ','Tx','РЎС‚Р°С‚СѓСЃ','РЎРѕР·РґР°РЅ','Р”РµР№СЃС‚РІРёСЏ'], list.map((d) => `
    <tr><td class="mono">${d.id.slice(-8)}</td><td class="mono">${d.traderId.slice(-6)}</td><td class="mono">${d.trader?.accountId || ''}</td>
    <td>${PF.money(d.amount)}</td><td class="mono">${PF.esc(d.address)}</td><td class="mono">${PF.esc(d.txHash || '')}</td>
    <td class="mono">${d.status}</td><td>${PF.dt(d.createdAt)}</td>
    <td class="row">${d.status === 'PENDING' ? `<button class="green" onclick="approveDeposit('${d.id}')">РћРґРѕР±СЂРёС‚СЊ</button>
      <button class="red" onclick="rejectDeposit('${d.id}')">РћС‚РєР»РѕРЅРёС‚СЊ</button>` : ''}</td></tr>`))}</div>`;
}

async function approveDeposit(id) {
  if (!confirm('РћРґРѕР±СЂРёС‚СЊ РїРѕРїРѕР»РЅРµРЅРёРµ?')) return;
  await PF.api('/admin/deposits/' + id + '/approve', { method: 'POST' });
  PF.toast('РћРґРѕР±СЂРµРЅРѕ'); render();
}

async function rejectDeposit(id) {
  const reason = prompt('РџСЂРёС‡РёРЅР° РѕС‚РєР»РѕРЅРµРЅРёСЏ (РѕРїС†РёРѕРЅР°Р»СЊРЅРѕ):') || undefined;
  await PF.api('/admin/deposits/' + id + '/reject', { method: 'POST', body: JSON.stringify({ reason }) });
  PF.toast('РћС‚РєР»РѕРЅРµРЅРѕ'); render();
}

async function viewUsers(v) {

    <button class="ghost" onclick="render()">вџі</button></div>${PF.table(['Р РѕР»СЊ','РРјСЏ','Email','РЎС‚Р°С‚СѓСЃ','РЎРѕР·РґР°РЅ','Р”РµР№СЃС‚РІРёСЏ'], list.map((u) => `
    <tr><td class="mono">${u.role}</td><td>${PF.esc(u.name || '')}</td><td>${PF.esc(u.email)}</td>
    <td class="mono">${u.status ?? ''}</td><td>${PF.dt(u.createdAt)}</td>
    <td class="row">${u.role === 'TRADER' ? `<button class="ghost" onclick="impersonate('${u.id}')">Р’РѕР№С‚Рё</button>` : ''}</td></tr>`))}</div>`;
}

async function impersonate(id) {
  alert('Р¤СѓРЅРєС†РёСЏ РІС…РѕРґР° Р·Р° РїРѕР»СЊР·РѕРІР°С‚РµР»СЏ РЅРµ СЂРµР°Р»РёР·РѕРІР°РЅР° РІ СЌС‚РѕРј РґРµРјРѕ');

  <div class="card"><div class="panel-t"><h2>РћСЂРґРµСЂР° РїРѕ СЃС‚Р°С‚СѓСЃР°Рј</h2></div>

}

async function createAdmin() {
  const email = prompt('Email Р°РґРјРёРЅРёСЃС‚СЂР°С‚РѕСЂР°:'); if (!email) return;
  const password = prompt('РџР°СЂРѕР»СЊ (min 6):'); if (!password) return;
  const name = prompt('РРјСЏ (РѕРїС†РёРѕРЅР°Р»СЊРЅРѕ):') || undefined;
  await PF.api('/admin/admins', { method: 'POST', body: JSON.stringify({ email, password, name }) });
  PF.toast('РђРґРјРёРЅ СЃРѕР·РґР°РЅ'); render();
}

async function viewOrders(v) {
  const list = await PF.api('/admin/orders');
  v.innerHTML = `<div class="card"><div class="panel-t"><h2>Р’СЃРµ РѕСЂРґРµСЂР° (${list.length})</h2>
    <button class="ghost" onclick="render()">вџі РћР±РЅРѕРІРёС‚СЊ</button></div>${

    <td>${o.type}</td><td>${o.method}</td><td>${PF.money(o.amount)}</td><td>${o.feePlatform}</td>
    <td class="st-${o.status}"><b>${o.status}</b></td><td>${PF.dt(o.createdAt)}</td>
    <td class="row">${['PENDING','ASSIGNED'].includes(o.status)
      ? `<button class="green" onclick="resolve('${o.id}','complete')">Р—Р°РІРµСЂС€РёС‚СЊ</button>

         <button class="ghost" onclick="archiveOrder('${o.id}')">Р’ Р°СЂС…РёРІ</button>` : ''}</td></tr>`))}</div>`;

async function resolve(id, action) {
  if (action === 'cancel' && !confirm('РћС‚РјРµРЅРёС‚СЊ РѕСЂРґРµСЂ СЃ РІРѕР·РІСЂР°С‚РѕРј СЃСЂРµРґСЃС‚РІ РјРµСЂС‡Р°РЅС‚Сѓ?')) return;
  await PF.api(`/admin/orders/${id}/resolve`, { method: 'POST', body: JSON.stringify({ action }) });
  PF.toast('Р“РѕС‚РѕРІРѕ'); render();
}

async function archiveOrder(id) {
  if (!confirm('РћС‚РїСЂР°РІРёС‚СЊ РѕСЂРґРµСЂ РІ Р°СЂС…РёРІ?')) return;

async function viewMerchants(v) {

    <div class="row"><button class="ghost" onclick="render()">вџі</button>
    <button class="green" onclick="createMerchant()">Р”РѕР±Р°РІРёС‚СЊ РјРµСЂС‡Р°РЅС‚Р°</button></div></div>${
    PF.table(['РРјСЏ','Email','РЎС‚Р°С‚СѓСЃ','РљРѕРјРёСЃСЃРёСЏ %','Р‘Р°Р»Р°РЅСЃ в‚Ѕ','Р”РµР№СЃС‚РІРёСЏ'], list.map((m) => `
    <tr><td>${PF.esc(m.name)}</td><td>${PF.esc(m.email)}</td>
    <td class="${m.status === 'ACTIVE' ? 'st-COMPLETED' : 'st-FAILED'}"><b>${m.status}</b></td>
    <td>${m.feePercent}</td><td>${PF.money(m.balance)}</td>
    <td class="row">
      ${m.status !== 'ACTIVE'
        ? `<button class="green" onclick="merchantPatch('${m.id}',{status:'ACTIVE'})">РђРєС‚РёРІРёСЂРѕРІР°С‚СЊ</button>`
        : `<button class="yellow" onclick="merchantPatch('${m.id}',{status:'SUSPENDED'})">Suspend</button>`}
      <button class="ghost" onclick="editFee('${m.id}',${m.feePercent})">РљРѕРјРёСЃСЃРёСЏ %</button>
      <button class="ghost" onclick="adjustBalance('MERCHANT','${m.id}')">Р‘Р°Р»Р°РЅСЃ В±</button>
      <button class="ghost" onclick="editWebhookUrl('${m.id}', '${PF.esc(m.webhookUrl || '')}')">Webhook URL</button>
      <button class="ghost" onclick="regenCallbackSecret('${m.id}')">Callback-СЃРµРєСЂРµС‚ вџі</button>
    </td></tr>`))}</div>`;
}
async function merchantPatch(id, body) { await PF.api('/admin/merchants/' + id, { method: 'PATCH', body: JSON.stringify(body) }); PF.toast('OK'); render(); }
async function editWebhookUrl(id, current) {
  const url = prompt('Webhook URL РјРµСЂС‡Р°РЅС‚Р° (РєСѓРґР° СЃР»Р°С‚СЊ СЃРѕР±С‹С‚РёСЏ Рѕ Р·Р°РєР°Р·Р°С…):', current);
  if (url === null) return;
  await merchantPatch(id, { webhookUrl: url || null });
}
async function regenCallbackSecret(id) {
  if (!confirm('РџРµСЂРµРІС‹РїСѓСЃС‚РёС‚СЊ callback-СЃРµРєСЂРµС‚? РЎС‚Р°СЂС‹Р№ РїРµСЂРµСЃС‚Р°РЅРµС‚ СЂР°Р±РѕС‚Р°С‚СЊ.')) return;
  const r = await PF.api(`/admin/merchants/${id}/regenerate-callback-secret`, { method: 'POST' });
  showSecret('РќРѕРІС‹Р№ callback-СЃРµРєСЂРµС‚ (РїРѕРєР°Р¶РµС‚СЃСЏ РѕРґРёРЅ СЂР°Р·):', r.callback_secret);
}
function showSecret(title, secret) {
  const w = window.open('', '_blank', 'width=640,height=320');
  if (!w) { prompt(title, secret); return; }
  w.document.write(`<body style="font-family:monospace;padding:24px"><h3>${title}</h3><p style="word-break:break-all;font-size:16px">${secret}</p><button onclick="close()">Р—Р°РєСЂС‹С‚СЊ</button></body>`);
}
async function editFee(id, current) {
  const fee = parseFloat(prompt('РќРѕРІР°СЏ РєРѕРјРёСЃСЃРёСЏ РјРµСЂС‡Р°РЅС‚Р°, %:', current));
  if (!isNaN(fee)) { await merchantPatch(id, { feePercent: fee }); }
}
async function adjustBalance(type, id) {
  const amount = parseFloat(prompt('РЎСѓРјРјР° РєРѕСЂСЂРµРєС‚РёСЂРѕРІРєРё (РјРѕР¶РµС‚ Р±С‹С‚СЊ РѕС‚СЂРёС†Р°С‚РµР»СЊРЅРѕР№):'));
  if (isNaN(amount)) return;
  await PF.api('/admin/balance-adjust', { method: 'POST',
    body: JSON.stringify({ partyType: type, partyId: id, amount, memo: 'UI adjustment' }) });
  PF.toast('Р‘Р°Р»Р°РЅСЃ РёР·РјРµРЅС‘РЅ'); render();
}

  const name = prompt('РќР°Р·РІР°РЅРёРµ РјРµСЂС‡Р°РЅС‚Р°:'); if (!name) return;

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayFlow — Кабинет трейдера</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css?v=7">
<script src="/vendor/socket.io.min.js"></script>
</head>
<body>
<div id="app" class="hidden">
  <header>
    <div class="logo">Pay<span>Flow</span> <span style="font-size:12px;color:var(--muted)">trader</span></div>
    <div class="hdr-right">
      <span class="badge TRADER" id="roleBadge">TRADER</span>
      <span style="color:var(--muted);font-size:13px" id="whoami"></span>
      <button class="ghost" onclick="PF.openDeposit()">Пополнение</button>
      <button class="ghost" onclick="PF.logout()">Выйти</button>
    </div>
  </header>
  <div class="content">
    <nav class="sidebar" id="nav"></nav>
    <main class="main" id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Deposit form will be rendered inside Deposits tab -->

<script src="/app.js?v=6"></script>
<script>
// Reordered: Главная -> Сделки -> Ордера -> Архив ордеров -> Реквизиты -> Пополнение
const TABS = ['dashboard','deals','orders','archive','requisites','deposits'];
const LABELS = { dashboard:'Главная', deals:'Сделки', orders:'Ордера', archive:'Архив ордеров', requisites:'Реквизиты', deposits:'Пополнение' };
let tab = 'dashboard';

(async () => {
  const me = await PF.requireRole('TRADER');
  if (!me) return;
  document.getElementById('app').classList.remove('hidden');
  const nav = document.getElementById('nav');
  
  for (const t of TABS) {
    const b = document.createElement('button');
    b.textContent = LABELS[t];
    b.dataset.tab = t;
    b.onclick = () => { tab = t; render(); };
    nav.appendChild(b);
  }
  
  // separator + logout at the bottom
  nav.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  const outBtn = document.createElement('button');
  outBtn.textContent = 'Выйти';
  outBtn.onclick = () => PF.logout();
  outBtn.style.marginTop = '8px';
  nav.appendChild(outBtn);
  
  render();
  PF.connectWS({
    onNewOrder: (o) => { PF.toast('Новый ордер ' + o.amount + ' ' + o.currency); if (tab === 'orders') render(); },
    onExpired: () => { PF.toast('Ордер истёк'); render(); },
    onOrderUpdated: (o) => {
      if (o.status === 'COMPLETED' && tab === 'deals') render();
      if (['CANCELLED','EXPIRED','DISPUTED'].includes(o.status) && tab === 'archive') render();
    },
  });
})();

async function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  const v = document.getElementById('view');
  v.innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    if (tab === 'dashboard') await viewDashboard(v);
    else if (tab === 'deals') await viewDeals(v);
    else if (tab === 'orders') await viewOrders(v);
    else if (tab === 'archive') await viewArchive(v);
    else if (tab === 'requisites') await viewRequisites(v);
    else if (tab === 'deposits') await viewDeposits(v);
  } catch (err) { v.innerHTML = '<div class="empty">' + PF.esc(err.message) + '</div>'; }
}

async function viewDashboard(v) {
  const [me, bal, deals] = await Promise.all([
    PF.api('/trader/me'),
    PF.api('/trader/me/balance'),
    PF.api('/trader/me/deals').catch(() => []),
  ]);
  const activeCount = deals.filter(d => d.type === 'DEPOSIT').length;
  const withdrawCount = deals.filter(d => d.type === 'WITHDRAWAL').length;
  v.innerHTML = `<div class="grid">
    ${PF.statCard('Баланс', PF.money(me.balance) + ' руб', Number(me.balance) < 0 ? 'var(--red)' : 'var(--green)')}
    ${PF.statCard('Активных ордеров', bal.lockedOrders, 'var(--yellow)')}
    ${PF.statCard('Завершённых сделок', deals.length, 'var(--green)')}
    ${PF.statCard('Успешных / Провалов', me.successCount + ' / ' + me.failCount, 'var(--green)')}
  </div>
  <div class="card" style="margin-bottom:20px"><div class="panel-t"><h2>Статус на линии</h2></div>
    <div class="row" style="align-items:center;font-size:14px;flex-wrap:wrap">
      <span style="color:${me.isOnline ? 'var(--green)' : 'var(--muted)'}">${me.isOnline ? 'Онлайн' : 'Офлайн'}</span>
      <span style="margin-left:12px">ID: <b class="mono" style="color:var(--accent)">${me.traderCode || '—'} (Acc: ${me.accountId || me.id})</b></span>
      <button class="${me.isOnline ? 'red' : 'green'}" onclick="toggleOnline(${!me.isOnline})" style="margin-left:12px">
        ${me.isOnline ? 'Офлайн' : 'На линию'}</button>
    </div>
      <p class="sub" style="margin-top:14px;margin-bottom:0">
        Методы: CARD ${me.methodCard ? 'Активен' : 'Неактивен'} | SBP ${me.methodSbp ? 'Активен' : 'Неактивен'}
        &nbsp;|&nbsp; Лимиты: ${PF.money(me.minOrderAmount)}-${PF.money(me.maxOrderAmount)} руб | до ${me.maxConcurrentOrders} ордеров
      </p></div>
    <!-- Limits editing moved to Requisites tab per UX request -->
  <div class="card"><div class="panel-t"><h2>Последние операции</h2></div>${
    PF.table(['Время','Тип','Сумма','Баланс после'], bal.entries.slice(0, 15).map((l) => `
    <tr><td>${PF.dt(l.createdAt)}</td><td class="mono">${l.kind}</td>
    <td style="color:${Number(l.amount) >= 0 ? 'var(--green)' : 'var(--red)'}">${Number(l.amount).toLocaleString('ru')}</td>
    <td>${Number(l.balanceAfter).toLocaleString('ru')}</td></tr>`))}</div>`;
}
async function toggleOnline(on) {
  await PF.api('/trader/me', { method: 'PATCH', body: JSON.stringify({ isOnline: on }) });
  PF.toast(on ? 'Вы на линии' : 'Вы офлайн'); render();
}

async function viewDeals(v) {
  const deals = await PF.api('/trader/me/deals');
  const totalVolume = deals.reduce((s, d) => s + Number(d.amount), 0);
  const totalFees = deals.reduce((s, d) => s + Number(d.feeTrader), 0);
  v.innerHTML = `<div class="grid">
    ${PF.statCard('Всего сделок', deals.length, 'var(--green)')}
    ${PF.statCard('Объём', PF.money(totalVolume) + ' ' + (deals[0]?.currency || 'RUB'), 'var(--cyan)')}
    ${PF.statCard('Заработано на fee', PF.money(totalFees), 'var(--accent)')}
    ${PF.statCard('DEPOSIT / WITHDRAWAL', (deals.filter(d => d.type === 'DEPOSIT').length) + ' / ' + (deals.filter(d => d.type === 'WITHDRAWAL').length), 'var(--yellow)')}
  </div>
  <div class="card">
    <div class="panel-t"><h2>История сделок (${deals.length})</h2>
      <button class="ghost" onclick="render()">Обновить</button></div>
    ${deals.length ? PF.table(['Тип','Метод','Сумма','Merchant','Fee трейдера','Дата','Завершена'], deals.map((d) => `
      <tr><td><span class="st-${d.type === 'DEPOSIT' ? 'COMPLETED' : 'ASSIGNED'}">${d.type}</span></td><td>${d.method}</td>
      <td style="font-weight:600">${PF.money(d.amount)}</td>
      <td class="mono" title="${PF.esc(d.merchantName || '')}">${(d.merchantName || '').slice(0,15)}</td>
      <td style="color:var(--green)">+${PF.money(d.feeTrader)}</td>
      <td>${PF.dt(d.createdAt)}</td><td>${d.completedAt ? PF.dt(d.completedAt) : '—'}</td></tr>`))
      : '<div class="empty">Пока нет завершённых сделок</div>'}
  </div>`;
}

async function viewArchive(v) {
  const archived = await PF.api('/trader/me/orders/archived');
  const cancelled = archived.filter(o => o.status === 'CANCELLED');
  const expired = archived.filter(o => o.status === 'EXPIRED');
  const disputed = archived.filter(o => o.status === 'DISPUTED');
  v.innerHTML = `<div class="grid">
    ${PF.statCard('Всего в архиве', archived.length, 'var(--muted)')}
    ${PF.statCard('Отменено', cancelled.length, 'var(--red)')}
    ${PF.statCard('Просрочено', expired.length, 'var(--yellow)')}
    ${PF.statCard('Споры', disputed.length, 'var(--accent2)')}
  </div>
  <div class="card">
    <div class="panel-t"><h2>Архив ордеров (${archived.length})</h2>
      <button class="ghost" onclick="render()">Обновить</button></div>
    ${archived.length ? PF.table(['Тип','Метод','Сумма','Merchant','Статус','Причина','Дата'], archived.map((o) => `
      <tr><td>${o.type}</td><td>${o.method}</td>
      <td style="font-weight:600">${PF.money(o.amount)}</td>
      <td class="mono" title="${PF.esc(o.merchantName || '')}">${(o.merchantName || '').slice(0,15)}</td>
      <td class="st-${o.status}">${o.status}</td>
      <td style="font-size:12px;color:var(--muted)">${o.cancelReason ? PF.esc(o.cancelReason.slice(0,40)) : '—'}</td>
      <td>${PF.dt(o.completedAt || o.createdAt)}</td></tr>`))
      : '<div class="empty">Архив пуст</div>'}
  </div>`;
}

async function viewOrders(v) {
  const list = await PF.api('/trader/orders');
  v.innerHTML = `<div class="card"><div class="panel-t"><h2>Мои ордера (${list.length})</h2>
    <button class="ghost" onclick="render()">Обновить</button></div>${
    PF.table(['ID','Тип','Метод','Сумма','Fee','Статус','Истекает','Действия'], list.map((o) => {
      let actions = '—';
      if (o.status === 'PENDING') {
        const acceptWindow = (new Date(o.createdAt)).getTime() + 10*60*1000;
        if (Date.now() <= acceptWindow) {
          actions = `<button onclick="tAction('${o.id}','accept')">Принять</button>
                     <button class="red" onclick="tDecline('${o.id}')">Отказаться</button>`;
        } else {
          actions = 'архив';
        }
      }
      else if (o.status === 'ASSIGNED' && o.type === 'DEPOSIT')
        actions = `<button class="green" onclick="tConfirm('${o.id}')">Платёж получен</button>
                   <button class="red" onclick="tDecline('${o.id}')">Отказаться</button>`;
      else if (o.status === 'ASSIGNED' && o.type === 'WITHDRAWAL')
        actions = `<button class="green" onclick="tAction('${o.id}','mark-paid')">Выплачено</button>
                   <button class="ghost" onclick="showPayout('${o.id}', this)">Реквизиты</button>`;
      return `<tr><td class="mono">${o.id.slice(-8)}</td><td>${o.type}</td><td>${o.method}</td>
      <td>${PF.money(o.amount)}</td><td>${o.feeTrader ?? o.fee}</td>
      <td class="st-${o.status}"><b>${o.status}</b></td><td>${PF.dt(o.expiresAt)}</td>
      <td class="row">${actions}</td></tr>`;
    }))}</div>
  <pre id="payoutBox" class="mono card payout hidden" style="margin-top:16px"></pre>`;
}
async function tAction(id, act, body = {}) {
  await PF.api(`/trader/orders/${id}/${act}`, { method: 'POST', body: JSON.stringify(body) });
  PF.toast(act === 'accept' ? 'Ордер принят' : 'Готово'); render();
}
async function tDecline(id) {
  if (!confirm('Отказаться? Ордер уйдёт другому трейдеру, статистика ухудшится.')) return;
  await PF.api(`/trader/orders/${id}/decline`, { method: 'POST',
    body: JSON.stringify({ reason: 'declined via cabinet' }) });
  PF.toast('Заказ передан другому трейдеру'); render();
}
async function tConfirm(id) {
  const payerName = prompt('Имя плательщика (опционально):') || undefined;
  await tAction(id, 'confirm', { payerName });
}
async function showPayout(id, btn) {
  const box = document.getElementById('payoutBox');
  const det = await PF.api('/trader/orders/' + id);
  box.classList.remove('hidden');
  box.textContent = JSON.stringify(det.payoutRequisites, null, 2);
}

async function viewRequisites(v) {
  const [list, me] = await Promise.all([PF.api('/trader/me/requisites'), PF.api('/trader/me')]);
  v.innerHTML = `<div class="card form-card"><div class="panel-t"><h2>Добавить реквизиты</h2></div>
  <label>Метод<select id="rqMethod" onchange="
    document.getElementById('cardFields').classList.toggle('hidden', this.value !== 'CARD');
    document.getElementById('sbpFields').classList.toggle('hidden', this.value !== 'SBP')">
    <option value="CARD">CARD</option><option value="SBP">SBP</option></select></label>
  <label>Банк<input id="rqBank" placeholder="Sberbank / T-Bank / Alpha-Bank"></label>
  <label>Получатель<input id="rqReceiver" placeholder="IVAN IVANOV"></label>
  <div id="cardFields"><label>Номер карты<input id="rqCard" placeholder="4276XXXXXXXXXXXX"></label></div>
  <div id="sbpFields" class="hidden"><label>Телефон СБП<input id="rqPhone" placeholder="+79001234567"></label></div>
  <button onclick="addReq()">Добавить</button>
  <p class="sub" style="margin-top:12px;margin-bottom:0">Номер карты шифруется AES-256-GCM и никогда не показывается полностью.</p></div>
  <div class="card form-card"><div class="panel-t"><h2>Лимиты и таймер</h2><button class="ghost" onclick="render()">Отмена</button></div>
    <label>Мин. сумма<input id="limitMin" value="${Number(me.minOrderAmount || 0)}"></label>
    <label>Макс. сумма<input id="limitMax" value="${Number(me.maxOrderAmount || 0)}"></label>
    <label>Макс. параллельных<input id="limitMaxConc" value="${me.maxConcurrentOrders || 1}"></label>
    <label>Сделок в день<input id="limitPerDay" value="${me.dealsPerDay ?? 100}"></label>
    <label>Таймер между сделками (сек)<input id="limitCooldown" value="${me.dealCooldownSeconds ?? 30}"></label>
    <div class="row"><button onclick="saveLimits()">Сохранить</button></div>
  </div>
  <div class="card">${PF.table(['Метод','Банк','Получатель','Данные','Активен',''], list.map((r) => `
  <tr><td>${r.method}</td><td>${PF.esc(r.bankName)}</td><td>${PF.esc(r.receiverName)}</td>
  <td class="mono">${r.cardLast4 ? '**** **** **** ' + r.cardLast4 : PF.esc(r.sbpPhone || '')}</td>
  <td class="${r.isActive ? 'st-COMPLETED' : 'st-FAILED'}">${r.isActive ? 'да' : 'нет'}</td>
  <td><button class="red" onclick="removeReq('${r.id}')">Удалить</button></td></tr>`))}</div>`;
}
async function addReq() {
  const m = document.getElementById('rqMethod').value;
  const body = {
    method: m,
    bankName: document.getElementById('rqBank').value.trim(),
    receiverName: document.getElementById('rqReceiver').value.trim(),
  };
  if (m === 'CARD') body.cardNumber = document.getElementById('rqCard').value.replace(/\D/g, '');
  else body.phone = document.getElementById('rqPhone').value.trim();
  try { await PF.api('/trader/me/requisites', { method: 'POST', body: JSON.stringify(body) }); PF.toast('Реквизит добавлен'); render(); }
  catch (e) { alert(e.message); }
}
async function removeReq(id) {
  if (!confirm('Удалить реквизит?')) return;
  await PF.api('/trader/me/requisites/' + id, { method: 'DELETE' });
  PF.toast('Реквизит удалён'); render();
}

async function viewDeposits(v) {
  const addr = 'TRC-20 TGC6SGLQoW5szUhJhBBAfMmp7QYLnc4Lix';
  const list = await PF.api('/trader/me/deposits');
  v.innerHTML = `<div class="card form-card"><div class="panel-t"><h2>Пополнение баланса</h2>
    <div class="row"><button class="ghost" onclick="render()">Отмена</button><button class="ghost" onclick="renderDeposits()">Обновить</button></div></div>
    <p style="margin-bottom:12px;color:var(--muted);font-size:13px">Адрес TRC-20: <b class="mono" style="color:var(--accent)">${addr}</b></p>
    <label>Сумма (USD)<input id="depAmount" placeholder="50"></label>
    <label>Tx hash (опционально)<input id="depTx" placeholder="0x..."></label>
    <div class="row"><button onclick="submitDeposit()">Создать заявку</button>
    <button class="ghost" onclick="render()">Отмена</button></div>
    <p class="sub" style="margin-top:14px;margin-bottom:0">Минимальная сумма пополнения $50.</p></div>
  <div class="card"><div class="panel-t"><h2>Архив пополнений (${list.length})</h2></div>
    ${PF.table(['ID','Сумма','Статус','Причина / Примечание','Админ','Создан'], list.map((d) => `
      <tr><td class="mono">${d.id.slice(-8)}</td><td>${PF.money(d.amount)}</td><td class="mono">${d.status}</td>
      <td>${PF.esc(d.adminNote || '')}</td><td class="mono">${PF.esc(d.processedBy || '')} ${d.processedAt ? ' / ' + PF.dt(d.processedAt) : ''}</td><td>${PF.dt(d.createdAt)}</td></tr>`))}</div>`;
}

async function renderDeposits() { const v = document.getElementById('view'); await viewDeposits(v); }

async function submitDeposit() {
  const amount = Number(document.getElementById('depAmount').value || 0);
  const tx = document.getElementById('depTx').value.trim() || undefined;
  try {
    await PF.api('/trader/me/deposits', { method: 'POST', body: JSON.stringify({ amount, txHash: tx }) });
    PF.toast('Заявка создана'); renderDeposits();
  } catch (e) { alert(e.message); }
}

async function saveLimits() {
  const min = Number(document.getElementById('limitMin').value || 0);
  const max = Number(document.getElementById('limitMax').value || 0);
  const conc = Number(document.getElementById('limitMaxConc').value || 1);
  const perDay = Number(document.getElementById('limitPerDay')?.value || 0);
  const cooldown = Number(document.getElementById('limitCooldown')?.value || 0);
  await PF.api('/trader/me', { method: 'PATCH', body: JSON.stringify({ minOrderAmount: min, maxOrderAmount: max, maxConcurrentOrders: conc, dealsPerDay: perDay, dealCooldownSeconds: cooldown }) });
  PF.toast('Лимиты сохранены'); render();
}
</script>
</body>
</html>

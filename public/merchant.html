<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayFlow вЂ” РљР°Р±РёРЅРµС‚ РјРµСЂС‡Р°РЅС‚Р°</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css?v=6">
<script src="/vendor/socket.io.min.js"></script>
</head>
<body>
<div id="app" class="hidden">
  <header>
    <div class="logo">Pay<span>Flow</span> <span style="font-size:12px;color:var(--muted)">merchant</span></div>
    <div class="hdr-right">
      <span class="badge MERCHANT" id="roleBadge">MERCHANT</span>
      <span style="color:var(--muted);font-size:13px" id="whoami"></span>
      <button class="ghost" onclick="PF.logout()">Р’С‹Р№С‚Рё</button>
    </div>
  </header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>

<script src="/app.js?v=6"></script>
<script>
const TABS = ['dashboard', 'orders', 'new-order', 'keys'];
const LABELS = { dashboard:'РћР±Р·РѕСЂ', orders:'РћСЂРґРµСЂР°', 'new-order':'РЎРѕР·РґР°С‚СЊ РѕСЂРґРµСЂ', keys:'API-РєР»СЋС‡Рё' };
let tab = 'dashboard';

(async () => {
  const me = await PF.requireRole('MERCHANT');
  if (!me) return;
  document.getElementById('app').classList.remove('hidden');
  const nav = document.getElementById('nav');
  for (const t of TABS) {
    const b = document.createElement('button');
    b.textContent = LABELS[t];
    b.dataset.tab = t;
    b.onclick = () => { tab = t; render(); };
    nav.appendChild(b);
  }
  render();
  PF.connectWS({
    onOrderUpdated: (o) => { PF.toast(`РћСЂРґРµСЂ вЂ¦${o.id.slice(-8)} в†’ ${o.status}`); if (tab === 'orders') render(); },
  });
})();

async function render() {
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  const v = document.getElementById('view');
  v.innerHTML = '<div class="empty">Р—Р°РіСЂСѓР·РєР°вЂ¦</div>';
  try {
    if (tab === 'dashboard') await viewDashboard(v);
    else if (tab === 'orders') await viewOrders(v);
    else if (tab === 'new-order') viewNewOrder(v);
    else if (tab === 'keys') await viewKeys(v);
  } catch (err) { v.innerHTML = `<div class="empty">${PF.esc(err.message)}</div>`; }
}

async function viewDashboard(v) {
  const [me, ledger] = await Promise.all([PF.api('/merchant/me'), PF.api('/merchant/me/ledger')]);
  const orders = await PF.api('/merchant/orders');
  const completed = orders.filter((o) => o.status === 'COMPLETED');
  const volume = completed.reduce((s, o) => s + Number(o.amount), 0);
  const pending = orders.filter((o) => ['PENDING','ASSIGNED'].includes(o.status)).length;
  v.innerHTML = `<div class="grid">
    ${PF.statCard('Р‘Р°Р»Р°РЅСЃ', PF.money(me.balance) + ' в‚Ѕ', Number(me.balance) < 0 ? 'var(--red)' : 'var(--green)')}
    ${statCard2('РљРѕРјРёСЃСЃРёСЏ РїР»Р°С‚С„РѕСЂРјС‹', me.feePercent + '%')}
    ${PF.statCard('РћР±РѕСЂРѕС‚ (Р·Р°РІРµСЂС€С‘РЅРЅС‹Рµ)', PF.money(volume) + ' в‚Ѕ', 'var(--cyan)')}
    ${PF.statCard('Р’ СЂР°Р±РѕС‚Рµ', pending, 'var(--yellow)')}
  </div>
  <div class="card"><div class="panel-t"><h2>РџРѕСЃР»РµРґРЅРёРµ РѕРїРµСЂР°С†РёРё</h2></div>${
    PF.table(['Р’СЂРµРјСЏ','РўРёРї','РЎСѓРјРјР°','Р‘Р°Р»Р°РЅСЃ РїРѕСЃР»Рµ'], ledger.slice(0, 12).map((l) => `
    <tr><td>${PF.dt(l.createdAt)}</td><td class="mono">${l.kind}</td>
    <td style="color:${Number(l.amount) >= 0 ? 'var(--green)' : 'var(--red)'}">${Number(l.amount).toLocaleString('ru')}</td>
    <td>${Number(l.balanceAfter).toLocaleString('ru')}</td></tr>`))}</div>`;
}
function statCard2(t, val){ return `<div class="card stat"><h3>${t}</h3><div class="val">${val}</div></div>`; }

async function viewOrders(v) {
  const list = await PF.api('/merchant/orders');
  v.innerHTML = `<div class="card"><div class="panel-t"><h2>РњРѕРё РѕСЂРґРµСЂР° (${list.length})</h2>
    <button class="ghost" onclick="render()">вџі РћР±РЅРѕРІРёС‚СЊ</button></div>${
    PF.table(['ID','External','РўРёРї','РњРµС‚РѕРґ','РЎСѓРјРјР° в‚Ѕ','Fee в‚Ѕ','РЎС‚Р°С‚СѓСЃ','РЎРѕР·РґР°РЅ','Р—Р°РІРµСЂС€С‘РЅ'], list.map((o) => `
    <tr><td class="mono">${o.id.slice(-8)}</td><td class="mono">${PF.esc(o.merchantOrderId ?? '')}</td>
    <td>${o.type}</td><td>${o.method}</td><td>${PF.money(o.amount)}</td><td>${o.feeMerchant}</td>
    <td class="st-${o.status}"><b>${o.status}</b></td><td>${PF.dt(o.createdAt)}</td><td>${PF.dt(o.completedAt)}</td></tr>`))}</div>`;
}

function viewNewOrder(v) {
  const idem = 'ui-' + Date.now();
  v.innerHTML = `<div class="card form-card"><div class="panel-t"><h2>РћСЂРґРµСЂ С‡РµСЂРµР· API</h2></div>
  <label>Public key (pk_вЂ¦)<input id="pkKey" value="${sessionStorage.getItem('pf_pk') || ''}" placeholder="pk_..."></label>
  <label>РўРёРї<select id="ordType"><option value="DEPOSIT">DEPOSIT вЂ” РїСЂРёС‘Рј РїР»Р°С‚РµР¶Р°</option><option value="WITHDRAWAL">WITHDRAWAL вЂ” РІС‹РїР»Р°С‚Р°</option></select></label>
  <label>РњРµС‚РѕРґ<select id="ordMethod"><option value="CARD">CARD (Visa / Mastercard / РњРР )</option><option value="SBP">SBP</option></select></label>
  <label>РЎСѓРјРјР° в‚Ѕ<input id="ordAmount" type="number" min="100" value="5000"></label>
  <label>Idempotency key<input id="ordIdem" value="${idem}"></label>
  <button onclick="createOrder()">РћС‚РїСЂР°РІРёС‚СЊ</button>
  <pre id="ordOut" class="mono payout" style="margin-top:14px;color:var(--muted)">РћС‚РІРµС‚ РїРѕСЏРІРёС‚СЃСЏ Р·РґРµСЃСЊвЂ¦</pre>
  <p class="sub" style="margin-top:14px;margin-bottom:0">РђРІС‚РѕСЂРёР·Р°С†РёСЏ: Р·Р°РіРѕР»РѕРІРѕРє <span class="mono">x-api-key: pk_вЂ¦</span></p></div>`;
}

async function createOrder() {
  const pk = document.getElementById('pkKey').value.trim();
  sessionStorage.setItem('pf_pk', pk);
  const body = {
    type: document.getElementById('ordType').value,
    method: document.getElementById('ordMethod').value,
    amount: parseFloat(document.getElementById('ordAmount').value),
    idempotencyKey: document.getElementById('ordIdem').value.trim() || ('ui-' + Date.now()),
  };
  try {
    const res = await fetch('/orders', { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': pk },
      body: JSON.stringify(body) });
    const data = await res.json();
    document.getElementById('ordOut').textContent = JSON.stringify(data, null, 2);
    if (res.ok && !data.replayed) PF.toast('РћСЂРґРµСЂ СЃРѕР·РґР°РЅ, С‚СЂРµР№РґРµСЂ РЅР°Р·РЅР°С‡РµРЅ');
  } catch (e) { document.getElementById('ordOut').textContent = 'Error: ' + e.message; }
}

async function viewKeys(v) {
  const keys = await PF.api('/merchant/me/api-keys');
  v.innerHTML = `<div class="card form-card"><div class="panel-t"><h2>РќРѕРІС‹Р№ API-РєР»СЋС‡</h2></div>
  <label>РРјСЏ<input id="keyName" placeholder="production"></label>
  <button onclick="createKey()">РЎРѕР·РґР°С‚СЊ</button>
  <div id="keyOut" class="mono" style="margin-top:12px;word-break:break-all"></div></div>
  <div class="card">${PF.table(['Public key','РџСЂРµС„РёРєСЃ СЃРµРєСЂРµС‚Р°','РРјСЏ','РЎС‚Р°С‚СѓСЃ','Last used',''], keys.map((k) => `
  <tr><td class="mono">${k.publicKey}</td><td class="mono">${k.secretPrefix}</td><td>${PF.esc(k.name)}</td>
  <td class="st-${k.status}"><b>${k.status}</b></td><td>${PF.dt(k.lastUsedAt)}</td>
  <td>${k.status === 'ACTIVE' ? `<button class="red" onclick="revokeKey('${k.id}')">Revoke</button>` : ''}</td></tr>`))}</div>`;
}
async function createKey() {
  const res = await PF.api('/merchant/me/api-keys', { method: 'POST',
    body: JSON.stringify({ name: document.getElementById('keyName').value.trim() || 'default' }) });
  document.getElementById('keyOut').innerHTML =
    `publicKey: <b>${res.publicKey}</b><br>secret (РїРѕРєР°Р·Р°РЅ РѕРґРёРЅ СЂР°Р·): <b>${res.secret}</b>`;
  PF.toast('РљР»СЋС‡ СЃРѕР·РґР°РЅ вЂ” СЃРѕС…СЂР°РЅРёС‚Рµ secret СЃРµР№С‡Р°СЃ');
}
async function revokeKey(id) {
  if (!confirm('РћС‚РѕР·РІР°С‚СЊ РєР»СЋС‡? РРЅС‚РµРіСЂР°С†РёСЏ СЃ СЌС‚РёРј РєР»СЋС‡РѕРј РїРµСЂРµСЃС‚Р°РЅРµС‚ СЂР°Р±РѕС‚Р°С‚СЊ.')) return;
  await PF.api('/merchant/me/api-keys/' + id, { method: 'DELETE' });
  PF.toast('РљР»СЋС‡ РѕС‚РѕР·РІР°РЅ'); render();
}
</script>
</body>
</html>
